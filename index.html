<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi florecita~</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles.css">
    <link rel="shortcut icon" href="Imagenes/Favicon.png" type="image/x-icon">

</head>
<body style="background-color: rgb(241, 241, 241);">
    <div class="contenedor" id="Contenedor">
        <div class="InterfazUno" id="InterfazUno">
            <div id="ContenedorTitulos">
                <h1 id="Titulo" style="color: white; text-align: center; text-shadow: 2px 2px 2px black; margin: 0; font-size: 22px;">
                    Donde el <strong style="color: rgb(255, 120, 120); text-shadow: 2px 2px 2px red;">Carmín</strong> de
                    tus
                    ojos derrite mi invierno.
                </h1>
                <p id="NombreCaps"
                    style="margin: 0; font-family: 'Dancing Script', cursive; font-weight: weight; margin-bottom: 10px;">
                </p>
            </div>
            <div class="Imagen">
                <img src="Imagenes/Momiji/Momiji_My_Love_1.jpg" id="ImagenMomiji" alt=""
                    style="width: 200px; height: 250px; border-radius: 22px; box-shadow: 2px 2px 5px black;">
            </div>
            <div id="ContenedorInterfazDos" style="margin: 22px;">
                <div id="ContenedorDeCreacion" class="InterfazDos">
                    <button type="button" id="BotonJugar">
                        Jugar
                    </button>
                    <button type="button" id="BotonNotas">
                        ⭣ Mis notas ⭣
                    </button>
                    <button type="button" id="Musica">
                        ⭣ Musica ⭣
                    </button>
                </div>
            </div>

            <div id="NotasDelDesarrollador">
                <h1 style="text-align: center; color: black; text-shadow: 2px 2px 5px white; margin-left: 22px;">
                    Notas personales
                </h1>
                <div style="display: flex; justify-content: center; align-items: center;" id="MomijiNotas">
                </div>
            </div>

            <div id="ListaDeMusica">
                <h1 style="text-align: center; color: white; text-shadow: 2px 2px 5px black; margin-left: 22px;">
                    Musica del juego
                </h1>
                <div style="display: flex; justify-content: center; align-items: center;" id="ImagenMomijiMOF">
                </div>
            </div>

            <div id="ContenedorDeDialogos">
            </div>

            <div id="ContenedorDeBotones">
            </div>

            <div>
                <p class="Creditos" style="text-align: center; color: white; font-size: 10px; font-family: 'Courier New', Courier, monospace; text-shadow: 2px 2px 3px black; margin: 0;">
                    <strong style="text-shadow: 3px 3px 5px black;">Momiji-soft 2026</strong> Desarrollado por Lost in the cyberspace o CfGaMeS
                </p>
            </div>
        </div>
    </div>
    <audio src="Musica/Missing_Love.mp3" id="MusicaUno" loop></audio>
    <audio src="Musica/fuegos_artificiales.mp3" id="Sonidos"></audio>
    <script src="script.js"></script>
</body>
</html>
